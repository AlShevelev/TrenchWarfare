name: trench_warfare
description: A Trench Warfare turn-bases strategy game
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  tuple: ^2.0.2
  flame: ^1.37.0
  flame_tiled: ^3.1.1
  flame_texturepacker: ^5.1.1
  easy_localization: ^3.0.8
  provider: ^6.1.5
  http: ^1.6.0
  talker_flutter: ^5.1.17
  objectbox: ^5.3.2
  objectbox_flutter_libs: any
  xml: ^6.3.0
  audioplayers: ^6.8.0
  package_info_plus: ^10.1.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_lint: ^1.4.3
  test: ^1.31.1
  mockito : ^5.4.6
  build_runner: ^2.9.0
  objectbox_generator: ^5.3.2

objectbox:
  output_dir: database

flutter:
  uses-material-design: true
  assets:
    # maps
    - assets/tiles/
    - assets/tiles/test/
    - assets/tiles/tutorial/
    - assets/tiles/real/asia/
    - assets/tiles/real/europe/
    - assets/tiles/real/new_world/
    - assets/images/tiles/

    # sprites
    - assets/images/sprites/

    # general purpose images
    - assets/images/
    - assets/images/screens/cover/
    - assets/images/screens/game_field/
    - assets/images/screens/game_field/banners/
    - assets/images/screens/game_field/main/
    - assets/images/screens/game_field/cards/
    - assets/images/screens/game_field/cards/production_centers/
    - assets/images/screens/game_field/cards/special_strikes/
    - assets/images/screens/game_field/cards/terrain_modifiers/
    - assets/images/screens/game_field/cards/troop_boosters/
    - assets/images/screens/game_field/cards/units/
    - assets/images/screens/game_field/dialogs/
    - assets/images/screens/game_field/dialogs/win_defeat_turn/
    - assets/images/screens/game_field/dialogs/win_defeat_turn/photos/
    - assets/images/screens/new_game/
    - assets/images/screens/new_game/maps/europe/
    - assets/images/screens/save_load/
    - assets/images/screens/settings/
    - assets/images/screens/shared/
    - assets/images/screens/shared/banners/
    - assets/images/screens/shared/bookmarks/
    - assets/images/screens/tutorial/

    # localisation
    - assets/translations/

    #audio
    - assets/audio/music/
    - assets/audio/sounds/
    - assets/audio/sounds/attack/
    - assets/audio/sounds/battle_result/
    - assets/audio/sounds/produce/